<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="diyaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="1" />
      <stop offset="50%" stop-color="#E8912D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7A1F2B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circular Halo -->
  <circle cx="32" cy="32" r="30" fill="#7A1F2B" stroke="url(#goldGradient)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#C9A24B" stroke-width="1" stroke-dasharray="2,2" opacity="0.8" />
  
  <!-- Central Swastik Motif -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical and Horizontal Center -->
    <line x1="32" y1="18" x2="32" y2="46" />
    <line x1="18" y1="32" x2="46" y2="32" />
    
    <!-- Arms -->
    <line x1="32" y1="18" x2="42" y2="18" />
    <line x1="46" y1="32" x2="46" y2="42" />
    <line x1="32" y1="46" x2="22" y2="46" />
    <line x1="18" y1="32" x2="18" y2="22" />
  </g>
  
  <!-- 4 Auspicious Bindus (Dots) -->
  <circle cx="25" cy="25" r="1.8" fill="#FFD700" />
  <circle cx="39" cy="25" r="1.8" fill="#FFD700" />
  <circle cx="25" cy="39" r="1.8" fill="#FFD700" />
  <circle cx="39" cy="39" r="1.8" fill="#FFD700" />
</svg>
